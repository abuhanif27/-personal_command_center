<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Personal Command Center{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer components {
            .ui-card {
                @apply rounded-xl border border-slate-200 bg-white p-5 shadow-sm;
            }

            .ui-hero {
                @apply rounded-2xl border border-slate-200/80 bg-white/85 p-6 shadow-sm backdrop-blur-sm sm:p-8;
            }

            .ui-kicker {
                @apply text-sm font-semibold uppercase tracking-[0.14em];
            }

            .ui-button {
                @apply inline-flex items-center justify-center rounded-lg px-4 py-2 text-sm font-semibold transition;
            }

            .ui-button-primary {
                @apply ui-button bg-slate-900 text-white hover:bg-slate-800;
            }

            .ui-nav-link {
                @apply rounded-lg px-3 py-1.5 transition;
            }
        }

        @layer utilities {
            @keyframes fade-up {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .reveal {
                animation: fade-up 0.5s ease-out both;
            }

            .reveal-delay-1 {
                animation-delay: 0.1s;
            }

            .reveal-delay-2 {
                animation-delay: 0.2s;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute -top-24 -left-24 h-72 w-72 rounded-full bg-cyan-200/50 blur-3xl"></div>
        <div class="absolute top-40 -right-24 h-80 w-80 rounded-full bg-blue-200/50 blur-3xl"></div>
        <div class="absolute -bottom-24 left-1/3 h-80 w-80 rounded-full bg-emerald-200/40 blur-3xl"></div>
    </div>

    <nav class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/85 backdrop-blur-md">
        <div class="mx-auto flex h-16 w-full max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8">
            <a href="/" class="inline-flex items-center gap-2 font-semibold tracking-tight text-slate-900">
                <span class="grid h-8 w-8 place-items-center rounded-lg bg-slate-900 text-xs text-white">PCC</span>
                <span class="text-sm sm:text-base">Personal Command Center</span>
            </a>
            <button id="menu-toggle" class="ui-button md:hidden bg-slate-900 text-white hover:bg-slate-800" aria-expanded="false" aria-controls="mobile-menu" type="button">
                Menu
            </button>
            <div class="hidden items-center gap-1 rounded-xl bg-slate-100 p-1 text-sm font-medium text-slate-600 md:flex">
                <a href="/" class="ui-nav-link {% if request.path == '/' %}bg-white text-slate-900 shadow-sm{% else %}hover:bg-white/70 hover:text-slate-800{% endif %}">Home</a>
                <a href="/about/" class="ui-nav-link {% if request.path == '/about/' %}bg-white text-slate-900 shadow-sm{% else %}hover:bg-white/70 hover:text-slate-800{% endif %}">About</a>
                <a href="/mission/" class="ui-nav-link {% if request.path == '/mission/' %}bg-white text-slate-900 shadow-sm{% else %}hover:bg-white/70 hover:text-slate-800{% endif %}">Mission</a>
            </div>
        </div>
        <div id="mobile-menu" class="hidden border-t border-slate-200 bg-white px-4 py-3 md:hidden">
            <div class="space-y-1 text-sm font-medium text-slate-700">
                <a href="/" class="block rounded-lg px-3 py-2 {% if request.path == '/' %}bg-slate-100 text-slate-900{% else %}hover:bg-slate-100{% endif %}">Home</a>
                <a href="/about/" class="block rounded-lg px-3 py-2 {% if request.path == '/about/' %}bg-slate-100 text-slate-900{% else %}hover:bg-slate-100{% endif %}">About</a>
                <a href="/mission/" class="block rounded-lg px-3 py-2 {% if request.path == '/mission/' %}bg-slate-100 text-slate-900{% else %}hover:bg-slate-100{% endif %}">Mission</a>
            </div>
        </div>
    </nav>

    <main class="mx-auto w-full max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-10 border-t border-slate-200/80 bg-white/70 backdrop-blur-sm">
        <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-5 text-sm text-slate-500 sm:px-6 lg:px-8">
            <p>&copy; 2026 Personal Command Center</p>
            <p>Build calmly. Ship consistently.</p>
        </div>
    </footer>

    <script>
        (function () {
            const menuToggle = document.getElementById('menu-toggle');
            const mobileMenu = document.getElementById('mobile-menu');

            if (!menuToggle || !mobileMenu) {
                return;
            }

            menuToggle.addEventListener('click', function () {
                const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
                menuToggle.setAttribute('aria-expanded', String(!isExpanded));
                mobileMenu.classList.toggle('hidden');
            });
        })();
    </script>
</body>
</html>
